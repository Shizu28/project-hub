<div>
  <div class="overflow-hidden h-full rounded-2xl shadow-lg mx-16 my-8 p-16 text-center">
    <h3 class="font-bold text-3xl items-start flex justify-start">Projektübersicht</h3>
    <p class="text-xs text-gray-500 items-start flex justify-start mt-2 mb-4">
      Übersicht über die letzten begonnen, abgeschlossenen und verworfenen Projekte. Klicke auf ein
      Projekt für die Detailansicht oder das Bearbeiten des Projekts.
    </p>
    <app-table (onRowClickFn)="onRowClick($event)" [headers]="headers" [rows]="rows()">
      <h1>Projektübersicht</h1>
    </app-table>
  </div>
</div>
